services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fibermap
      POSTGRES_PASSWORD: fibermap_local
      POSTGRES_DB: fibermap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fibermap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibermap"]
      interval: 5s
      retries: 10
volumes:
  fibermap_data:
